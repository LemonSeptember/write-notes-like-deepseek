# 复制到宿主仓库 .github/workflows/verify-notes.yml 后启用。
# 默认项目级安装路径；使用其他路径时请同步修改下方命令。
name: 验证 Agent Notes

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 验证笔记目录树、格式与归档封印
        env:
          # HEAD 在干净检出上等于空操作。要对比改动前的提交：PR 用基线，push 用分支前一个 tip。
          # 新分支 push 时 before=0000…；git show 会失败，脚本跳过 append-only（仍校验封印与磁盘一致）。
          AGENT_NOTE_ARCHIVE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          npx tsx .agents/skills/write-notes-like-deepseek/scripts/verify-agent-note-tree.ts
          npx tsx .agents/skills/write-notes-like-deepseek/scripts/verify-agent-note-format.ts
          npx tsx .agents/skills/write-notes-like-deepseek/scripts/verify-archived-agent-notes.ts
